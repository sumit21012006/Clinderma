services:
  - type: web
    name: clinderma-chatbot
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: VECTOR_STORE_PROVIDER
        value: faiss
      - key: CRM_PROVIDER
        value: mock_kylas
      - key: ORDER_PROVIDER
        value: mock_orders
      - key: GROUNDING_THRESHOLD
        value: "0.35"
